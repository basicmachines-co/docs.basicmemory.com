name: Deploy to Development

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: development

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Fly CLI
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Generate fly.toml
        run: |
          set -a
          source .env.development
          set +a
          envsubst < fly.toml.template > fly.toml
          cat fly.toml

      - name: Stage OG image signing secret
        # OG image URLs are signed. Without a stable secret nuxt-og-image makes
        # a new one every build, so previews crawlers cached break after each
        # deploy. The value is a GitHub environment secret.
        run: |
          set -a
          source .env.development
          set +a
          flyctl secrets set NUXT_OG_IMAGE_SECRET="$NUXT_OG_IMAGE_SECRET" --app "$DOCS_APP_NAME" --stage
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          NUXT_OG_IMAGE_SECRET: ${{ secrets.NUXT_OG_IMAGE_SECRET }}

      - name: Deploy to Fly.io
        run: |
          GIT_SHA="${{ github.sha }}"
          flyctl deploy --remote-only --build-arg CACHE_BUST="$GIT_SHA"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
